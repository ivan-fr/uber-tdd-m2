version: '3.3'
services:
  postgres:
    image: 'postgres:13.2'
    ports:
      - "5433:5432"
    networks:
      - app_net
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ubertop-30-oct-2023

networks:
  app_net:
    driver: bridge
