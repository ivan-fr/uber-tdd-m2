services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5445:5432"
    environment:
      POSTGRES_USER: uber
      POSTGRES_PASSWORD: uber
      POSTGRES_DB: uber
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uber -d uber"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
